Name: primitives_v0
Version: v0
Description: |
  Blank-slate seed system. Contains no opinions about which bids should
  carry which meanings; the agent is expected to invent that mapping
  through evolution.

  The system intentionally violates "always open with values" on purpose:
  only one placeholder opening exists (1C with 12+ HCP). Every other bid
  token is an unassigned symbol that evolution may repurpose for
  Precision-style strong-club, Polish-club, multi-bids, transfers,
  relays, or anything else that improves IMPs vs. par.

  Hard constraints (enforced by the evaluator, not by conventions):
  * Communication invertibility: every convention's bid must be decodable
    by interpret_partner_bid from the docs alone.
  * Symbol consistency: same (AuctionPattern, Action) cannot mean two
    contradictory things.
Author: bridge_evolve
ParentSystem: null
HardConstraints:
  - invertibility
  - symbol_consistency
  - readability
