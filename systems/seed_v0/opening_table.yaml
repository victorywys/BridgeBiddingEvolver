OpeningTable:
  - OpeningRule:
      Name: Open1NT
      Description: 15-17 HCP, balanced.
      Priority: 100
      Requirements:
        HCP: "15..17"
        Balanced: true
      Action:
        Bid: "1NT"

  - OpeningRule:
      Name: Open2NT
      Description: 20-21 HCP, balanced.
      Priority: 99
      Requirements:
        HCP: "20..21"
        Balanced: true
      Action:
        Bid: "2NT"

  - OpeningRule:
      Name: Open1S
      Description: 12-21 HCP, 5+ spades (longest major).
      Priority: 90
      Requirements:
        HCP: ">=12"
        Spades: ">=5"
      Action:
        Bid: "1S"

  - OpeningRule:
      Name: Open1H
      Description: 12-21 HCP, 5+ hearts (no longer spade suit).
      Priority: 89
      Requirements:
        HCP: ">=12"
        Hearts: ">=5"
      Action:
        Bid: "1H"

  - OpeningRule:
      Name: Open1D
      Description: 12-21 HCP, 4+ diamonds, no 5-card major.
      Priority: 80
      Requirements:
        HCP: ">=12"
        Diamonds: ">=4"
      Action:
        Bid: "1D"

  - OpeningRule:
      Name: Open1C
      Description: 12-21 HCP, fallback opener.
      Priority: 79
      Requirements:
        HCP: ">=12"
        Clubs: ">=3"
      Action:
        Bid: "1C"
